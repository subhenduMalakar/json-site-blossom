
{% extends "layout.html" %}

{% block title %}{{ post.title }} - Directory Explorer{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-lg overflow-hidden">
    <img src="{{ post.imageUrl }}" alt="{{ post.title }}" class="w-full h-64 object-cover">
    <div class="p-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">{{ post.title }}</h1>
        <p class="text-gray-500 mb-6">{{ post.date }}</p>
        
        <div class="prose max-w-none">
            {{ post.content|safe }}
        </div>
        
        <div class="mt-8 pt-6 border-t border-gray-200">
            <h3 class="text-lg font-semibold mb-2">Tags:</h3>
            <div class="flex flex-wrap gap-2">
                {% for tag in post.tags %}
                <span class="bg-gray-100 text-gray-800 px-3 py-1 rounded-full text-sm">{{ tag }}</span>
                {% endfor %}
            </div>
        </div>
        
        <a href="{{ url_for('blog_list') }}" class="inline-block mt-6 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-4 py-2 rounded transition-colors">
            Back to Blog
        </a>
    </div>
</div>
{% endblock %}
