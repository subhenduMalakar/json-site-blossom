
{% extends "layout.html" %}

{% block title %}Favorites - Directory Explorer{% endblock %}

{% block content %}
<div x-data="{ favorites: [], loading: true }" x-init="
    fetch('/api/favorites')
        .then(response => response.json())
        .then(data => {
            favorites = data.favorites || [];
            loading = false;
        })
        .catch(error => {
            console.error('Error loading favorites:', error);
            loading = false;
        })
">
    <h1 class="text-3xl font-bold mb-6">Your Favorites</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6">
        <div x-show="loading" class="flex justify-center items-center py-12">
            <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        
        <div x-show="!loading && favorites.length === 0" class="text-center py-12">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
            <h3 class="text-xl font-semibold text-gray-700 mb-2">No favorites yet</h3>
            <p class="text-gray-500 mb-4">Start adding favorites from the directory to see them here.</p>
            <a href="{{ url_for('index') }}" class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-semibold px-4 py-2 rounded transition-colors">
                Explore Directory
            </a>
        </div>
        
        <div x-show="!loading && favorites.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="item in favorites" :key="item.id">
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                    <img :src="item.imageUrl" :alt="item.name" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <div class="flex justify-between items-start">
                            <h2 class="text-xl font-semibold" x-text="item.name"></h2>
                            <button 
                                class="text-yellow-500 hover:text-gray-400 focus:outline-none remove-favorite-btn" 
                                :data-id="item.id"
                                @click="
                                    favorites = favorites.filter(fav => fav.id !== item.id);
                                    fetch('/api/favorites', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                        },
                                        body: JSON.stringify({ favorites: favorites }),
                                    });
                                "
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118l-2.799-2.034c-.784-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                </svg>
                            </button>
                        </div>
                        <p class="text-gray-600 mb-2" x-text="item.category"></p>
                        <div class="flex items-center mb-2">
                            <span class="text-yellow-500 font-semibold mr-1" x-text="item.rating"></span>
                            <div class="flex">
                                <template x-for="i in 5" :key="i">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" :class="i <= item.rating ? 'text-yellow-500' : 'text-gray-300'" viewBox="0 0 20 20" fill="currentColor">
                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118l-2.799-2.034c-.784-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                    </svg>
                                </template>
                            </div>
                        </div>
                        <p class="text-gray-500 mb-4 line-clamp-3" x-text="item.description"></p>
                        <a :href="'/directory/' + item.id" class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-semibold px-4 py-2 rounded transition-colors">
                            View Details
                        </a>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
{% endblock %}
